name: CI - dbt build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install dbt and deps
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core==1.10.15 dbt-postgres==1.9.1

      - name: Configure profiles (from secrets)
        run: |
          mkdir -p $HOME/.dbt
          cat > $HOME/.dbt/profiles.yml <<'YAML'
          jaffle_shop:
            outputs:
              dev:
                type: postgres
                threads: 1
                host: ${{ secrets.DB_HOST }}
                port: ${{ secrets.DB_PORT }}
                user: ${{ secrets.DB_USER }}
                pass: ${{ secrets.DB_PASS }}
                dbname: ${{ secrets.DB_NAME }}
                schema: ${{ secrets.DB_SCHEMA }}
            target: dev
          YAML

      - name: Run dbt build
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SCHEMA: ${{ secrets.DB_SCHEMA }}
        run: |
          dbt --version
          dbt debug
          dbt build --profiles-dir $HOME/.dbt
